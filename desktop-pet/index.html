<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NEXORA Desktop Pet</title>
  <link rel="stylesheet" href="./style.css?v=2">
</head>
<body>
  <main class="pet-stage" id="pet-stage" aria-label="NEXORA 3D 桌面伙伴" tabindex="0">
    <span class="speech-bubble" id="speech-bubble" role="status" aria-live="polite" hidden></span>
    <section class="conversation" id="conversation" aria-label="桌面伙伴对话" hidden>
      <div class="conversation-status" id="conversation-status" role="status">我在，想聊什么？</div>
      <form class="conversation-form" id="conversation-form">
        <input
          class="conversation-input"
          id="conversation-input"
          name="message"
          type="text"
          maxlength="160"
          autocomplete="off"
          placeholder="和伙伴说句话"
          aria-label="对话内容"
        >
        <button class="conversation-send" id="conversation-send" type="submit" aria-label="发送消息">发送</button>
        <button class="conversation-close" id="conversation-close" type="button" aria-label="关闭对话">×</button>
      </form>
    </section>
  </main>
  <script type="module" src="./app.mjs?v=2"></script>
</body>
</html>
