name: Build Windows Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - product/private-cloud-staging
    paths:
      - "windows/NexoraBridge/**"
      - "desktop-pet/**"
      - "shared/creature-3d-*.mjs"
      - "desktop-wallpaper/vendor/**"
      - "NEXORA_3D_CREATURES/**/*.glb"
      - "tools/build-nexora-bridge-windows.ps1"
      - "tests/nexora-bridge-windows.test.mjs"
      - ".github/workflows/build-windows-bridge.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Build and self-test x64
        shell: pwsh
        run: ./tools/build-nexora-bridge-windows.ps1 -Runtime win-x64
      - name: Build ARM64
        shell: pwsh
        run: ./tools/build-nexora-bridge-windows.ps1 -Runtime win-arm64
      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: NEXORA-Bridge-Windows
          path: |
            dist/NEXORA-Bridge-Windows-x64.zip
            dist/NEXORA-Bridge-Windows-x64.zip.sha256
            dist/NEXORA-Bridge-Windows-ARM64.zip
            dist/NEXORA-Bridge-Windows-ARM64.zip.sha256
          if-no-files-found: error
          retention-days: 30
