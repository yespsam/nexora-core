name: Build Windows Bridge

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Existing successful build run to publish (skip rebuilding)'
        type: string
        default: ''
      release_tag:
        description: 'Draft desktop release receiving the verified packages'
        type: string
        default: ''
  push:
    branches:
      - product/private-cloud-staging
    paths:
      - "windows/NexoraBridge/**"
      - "desktop-pet/**"
      - "shared/creature-3d-*.mjs"
      - "shared/custom-companion-client.mjs"
      - "desktop-wallpaper/vendor/**"
      - "NEXORA_3D_CREATURES/**/*.glb"
      - "tools/build-nexora-bridge-windows.ps1"
      - "tests/nexora-bridge-windows.test.mjs"
      - ".github/workflows/build-windows-bridge.yml"

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.artifact_run_id == '' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Build and self-test x64
        shell: pwsh
        run: ./tools/build-nexora-bridge-windows.ps1 -Runtime win-x64
      - name: Build ARM64
        shell: pwsh
        run: ./tools/build-nexora-bridge-windows.ps1 -Runtime win-arm64
      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: NEXORA-Bridge-Windows
          path: |
            dist/NEXORA-Bridge-Windows-x64.zip
            dist/NEXORA-Bridge-Windows-x64.zip.sha256
            dist/NEXORA-Bridge-Windows-ARM64.zip
            dist/NEXORA-Bridge-Windows-ARM64.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish-existing:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != '' && inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Upload verified packages to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN: ${{ inputs.artifact_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^bridge-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(gh run view "$BUILD_RUN" --json conclusion --jq .conclusion)" == "success" ]]
          [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == "true" ]]
          mkdir packages
          gh run download "$BUILD_RUN" -n NEXORA-Bridge-Windows -D packages
          gh release download "$RELEASE_TAG" -p 'NEXORA-Bridge-macOS.*' -D packages
          cd packages
          sha256sum NEXORA-Bridge-macOS.dmg NEXORA-Bridge-macOS.zip NEXORA-Bridge-Windows-x64.zip NEXORA-Bridge-Windows-ARM64.zip > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" NEXORA-Bridge-Windows-x64.zip NEXORA-Bridge-Windows-ARM64.zip SHA256SUMS.txt
