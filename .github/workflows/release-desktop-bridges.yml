name: Release Signed Desktop Bridges

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Import Developer ID and notary credentials
        shell: bash
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for value in P12_BASE64 P12_PASSWORD NOTARY_KEY_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [[ -z "${!value:-}" ]]; then
              echo "Missing required Apple signing secret: $value" >&2
              exit 2
            fi
          done
          KEYCHAIN="$RUNNER_TEMP/nexora-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12_FILE="$RUNNER_TEMP/developer-id.p12"
          API_KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$P12_BASE64" | /usr/bin/base64 -D > "$P12_FILE"
          printf '%s' "$NOTARY_KEY_BASE64" | /usr/bin/base64 -D > "$API_KEY_FILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12_FILE" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          if [[ -z "$IDENTITY" ]]; then
            echo "The imported P12 does not contain a Developer ID Application identity." >&2
            exit 2
          fi
          xcrun notarytool store-credentials NEXORA_CI \
            --key "$API_KEY_FILE" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$KEYCHAIN" \
            --validate
          {
            echo "NEXORA_CODESIGN_IDENTITY=$IDENTITY"
            echo "NEXORA_CODESIGN_KEYCHAIN=$KEYCHAIN"
            echo "NEXORA_NOTARY_PROFILE=NEXORA_CI"
            echo "NEXORA_NOTARY_KEYCHAIN=$KEYCHAIN"
          } >> "$GITHUB_ENV"
          rm -f "$P12_FILE" "$API_KEY_FILE"
      - name: Build, sign, notarize, and staple macOS packages
        shell: bash
        run: npm run release:bridge:macos
      - name: Upload signed macOS packages
        uses: actions/upload-artifact@v7
        with:
          name: NEXORA-Bridge-macOS-signed
          path: |
            dist/NEXORA-Bridge-macOS.zip
            dist/NEXORA-Bridge-macOS.dmg
            dist/NEXORA-Bridge-macOS.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary keychain
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/nexora-signing.keychain-db" || true

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Import Authenticode certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64 -or -not $env:PFX_PASSWORD) {
            throw "Missing Windows signing secrets"
          }
          $PfxPath = Join-Path $env:RUNNER_TEMP "nexora-signing.pfx"
          [IO.File]::WriteAllBytes($PfxPath, [Convert]::FromBase64String($env:PFX_BASE64))
          $Password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $Certificate = Import-PfxCertificate -FilePath $PfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $Password
          if (-not $Certificate.Thumbprint) { throw "PFX did not provide a signing certificate" }
          "NEXORA_WINDOWS_CERT_THUMBPRINT=$($Certificate.Thumbprint)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "NEXORA_WINDOWS_CERT_PATH=$($Certificate.PSPath)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Remove-Item $PfxPath -Force
      - name: Build and sign Windows x64
        shell: pwsh
        run: ./tools/build-nexora-bridge-windows.ps1 -Runtime win-x64
      - name: Build and sign Windows ARM64
        shell: pwsh
        run: ./tools/build-nexora-bridge-windows.ps1 -Runtime win-arm64
      - name: Upload signed Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: NEXORA-Bridge-Windows-signed
          path: |
            dist/NEXORA-Bridge-Windows-x64.zip
            dist/NEXORA-Bridge-Windows-x64.zip.sha256
            dist/NEXORA-Bridge-Windows-ARM64.zip
            dist/NEXORA-Bridge-Windows-ARM64.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Remove imported certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:NEXORA_WINDOWS_CERT_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$env:NEXORA_WINDOWS_CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
