[build]
  command = "npm run build:public"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/hardware/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/modeling/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/videos/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/ai-companion/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/device-lab/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/QUICK_START.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/LICENSE"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/voice/status"
  to = "/.netlify/functions/voice-status"
  status = 200

[[redirects]]
  from = "/api/voice/voices"
  to = "/.netlify/functions/voice-voices"
  status = 200

[[redirects]]
  from = "/api/voice/select"
  to = "/.netlify/functions/voice-select"
  status = 200

[[redirects]]
  from = "/api/voice/speak"
  to = "/.netlify/functions/voice-speak"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "SAMEORIGIN"
    X-Robots-Tag = "noarchive"
    Permissions-Policy = "camera=(), geolocation=(), payment=(), usb=()"

[[headers]]
  for = "/NEXORA_3D_CREATURES/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Robots-Tag = "noindex, nofollow, noarchive"
